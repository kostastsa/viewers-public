<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pdfview</title>
<link rel="icon" type="image/png" href="/kit/icons/pdf.png">
<link rel="stylesheet" href="/kit/kit.css">
<link rel="stylesheet" href="/kit/pdfpages.css">
<style>
:root{color-scheme:dark;--bg:#111214;--fg:#d6d9de;--muted:#80858d;--panel:#16181b;--border:#2a2d32;--accent:#8a9bd6;
  --warn:#e0876a;--code:#1b1d21;--hl:#2b3350;--mark:rgba(255,200,60,.28);--mark-active:rgba(255,170,30,.55);--hl-mark:rgba(90,200,110,.28);--hl-line:rgba(60,170,90,.85);
  --desk:#0b0c0d;--ui:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#fafaf7;--fg:#222;--muted:#777;--panel:#f1f0ea;
  --border:#dcdad0;--accent:#2f5fc4;--warn:#b5482a;--code:#ecebe4;--hl:#dfe6f7;--mark:rgba(255,200,0,.33);--hl-mark:rgba(70,190,90,.3);--hl-line:rgba(40,150,70,.85);
  --mark-active:rgba(255,150,0,.5);--desk:#d9d8d2}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 var(--ui);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;background:none;color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:2px 8px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:default;border-color:var(--border);color:var(--fg)}
button.on{border-color:var(--accent);color:var(--accent)}
a{color:var(--accent)}

/* ----- header ----- */
header{display:flex;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--border);background:var(--panel);
  white-space:nowrap;min-height:40px}
header #home{color:var(--muted);text-decoration:none;font-weight:600}
header #name{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
header #dirLink{color:var(--muted);text-decoration:none}
header .grow{flex:1}
header .grp{display:flex;gap:4px;align-items:center}
#pageNum{width:44px;text-align:right;background:var(--code);color:var(--fg);border:1px solid var(--border);border-radius:4px;
  padding:1px 4px;font:inherit}
#zoomLabel{min-width:44px;text-align:center;color:var(--muted)}
#live{width:8px;height:8px;border-radius:50%;background:#5a9;display:inline-block}
#live.off{background:var(--warn)}

/* ----- layout ----- */
main{flex:1;display:grid;grid-template-columns:220px minmax(0,1fr) 320px;min-height:0}
body.nonav main{grid-template-columns:0 minmax(0,1fr) 320px}
body.noside main{grid-template-columns:220px minmax(0,1fr) 0}
body.nonav.noside main{grid-template-columns:0 minmax(0,1fr) 0}
body.noside.chatopen main{grid-template-columns:220px minmax(0,1fr) 320px}
body.nonav.noside.chatopen main{grid-template-columns:0 minmax(0,1fr) 320px}
nav{grid-column:1;border-right:1px solid var(--border);overflow:auto;padding:8px 6px;background:var(--panel);min-width:0}
#pages{grid-column:2}
aside{grid-column:3}  /* fixed columns: a hidden panel must not move the others */
body.nonav nav,body.noside aside{display:none}
nav h4,aside h4{margin:4px 6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  display:flex;align-items:center;gap:6px}
nav h4 .grow,aside h4 .grow{flex:1}
nav ul{list-style:none;margin:0;padding:0 0 0 10px}
nav>ul{padding-left:0}
nav li a{display:block;padding:2px 6px;color:var(--fg);text-decoration:none;border-radius:3px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
nav li a:hover{background:var(--hl)}
nav li a.cur{color:var(--accent)}
nav .empty{color:var(--muted);padding:4px 6px}

/* ----- pages: the page view is in the kit (pdfpages.css); here the marks of pdfview on the pages ----- */
.page .marks div{position:absolute;background:var(--mark);mix-blend-mode:normal;pointer-events:auto;cursor:pointer;border-radius:2px}
.page .marks div.active{background:var(--mark-active);outline:1px solid rgba(255,150,0,.8)}
.page .marks div.flash{animation:flash 1.2s ease-out 2}
@keyframes flash{50%{outline:3px solid var(--accent)}}
.page .marks div.draft{background:rgba(120,160,255,.35)}
/* a box comment: a frame at its area; the box that you draw; the cross cursor of the box tool */
.page .marks div.box{background:rgba(255,200,60,.07);border:2px solid rgba(240,160,20,.85);border-radius:3px;pointer-events:none;cursor:default}
.page .marks div.box .btag{position:absolute;left:-2px;top:-17px;pointer-events:auto;cursor:pointer;font:600 10.5px/16px system-ui,sans-serif;background:rgba(240,160,20,.95);color:#111;border-radius:3px 3px 0 0;padding:0 5px;white-space:nowrap}
.page .marks div.box.active .btag{background:rgba(255,120,0,1)}
.page .marks div.box .btag .bx{margin-left:6px;padding:0 3px;border-radius:3px;cursor:pointer;opacity:.75}
.page .marks div.box .btag .bx:hover{opacity:1;background:rgba(0,0,0,.18)}
.page .marks div.hl.box .btag{background:var(--hl-line)}
.page .marks div.box.active{border-color:rgba(255,120,0,1);box-shadow:0 0 0 3px rgba(255,150,0,.3);background:rgba(255,170,30,.12)}
.page .marks div.box.draft{border:2px dashed var(--accent);background:rgba(120,160,255,.12)}
.page .boxdraw{position:absolute;z-index:5;border:2px dashed var(--accent);background:rgba(120,160,255,.15);pointer-events:none}
body.altdown .page,body.altdown .page .textLayer span{cursor:crosshair}


/* ----- the bar on a selection: Comment and Highlight; the menu of a highlight ----- */
#selbar{position:fixed;z-index:30;display:none;gap:4px}
#selbar button,#hmenu button{background:var(--panel);border:1px solid var(--accent);color:var(--accent);border-radius:14px;
  padding:3px 10px;box-shadow:0 3px 12px rgba(0,0,0,.4)}
#selbar #hbtn{border-color:var(--hl-line);color:var(--fg)}
#hmenu{position:fixed;z-index:31;display:none;gap:4px}
#hmenu button.rm{border-color:var(--border);color:var(--fg)}
/* a highlight: a passage with no comment, in a soft green (the comments are yellow) */
.page .marks div.hl{background:var(--hl-mark)}
.page .marks div.hl.box{background:var(--hl-mark);border-color:var(--hl-line)}
/* the comment box of a new comment: on the page, under the selected words */
#pop{position:absolute;z-index:20;width:min(340px,calc(100% - 16px));margin:0;padding:8px;background:var(--panel);
  border:1px solid var(--accent);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#pop .where{color:var(--muted);font-size:11px;margin-bottom:4px}

/* ----- comments sidebar ----- */
aside{border-left:1px solid var(--border);overflow:auto;padding:8px 10px 20px;background:var(--panel);min-width:0}
aside .empty{color:var(--muted);padding:6px}
.stools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}  /* a long label moves Resolve all to a 2nd line */
.stools .grow{flex:1}
.stools button{white-space:nowrap;font-size:12px;padding:2px 9px}
.stools button[hidden]{display:none}
.thread{border:1px solid var(--border);border-radius:6px;padding:7px 9px;margin:0 0 8px;background:var(--bg);cursor:pointer}
.thread.active{border-color:var(--accent)}
.thread .top{display:flex;gap:6px;align-items:baseline;margin-bottom:4px}
.thread .where{color:var(--muted);font-size:11px;white-space:nowrap}
.thread q{color:var(--muted);font-style:italic;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.thread q::before,.thread q::after{content:none}
.thread .gen{flex:1;color:var(--muted)}
.pill{font-size:10px;border-radius:8px;padding:0 6px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.open{border-color:var(--accent);color:var(--accent)}
.pill.lost{border-color:var(--warn);color:var(--warn)}
.msg{padding:3px 0;border-top:1px dashed var(--border);position:relative}
.msg:first-of-type{border-top:0}
.msg .who{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.msg .who b{color:var(--fg);font-weight:600}
.msg.claude .who b{color:var(--accent)}
.msg .acts{margin-left:auto;display:none;gap:4px}
.msg:hover .acts{display:flex}
.msg .acts button,.thread .tacts button{font-size:11px;padding:0 6px}
.msg .md p{margin:.2em 0}
.msg .md pre,.cm .md pre{background:var(--code);padding:5px 7px;overflow:auto;font-size:12px;margin:.3em 0}
.md code{font:.92em ui-monospace,Menlo,monospace;background:var(--code);padding:0 .25em;border-radius:3px}
.md pre code{background:none;padding:0}
.md ul,.md ol{margin:.3em 0;padding-left:1.4em}
.md h4{margin:.5em 0 .2em;font-size:1em}
.md mjx-container{white-space:nowrap}
.md mjx-container[display="true"]{margin:.4em 0!important;overflow-x:auto;overflow-y:hidden;max-width:100%}
.thread .tacts{display:flex;gap:4px;margin-top:5px}
.composer{margin:4px 0 8px}
.composer q{display:block;color:var(--muted);font-style:italic;margin-bottom:4px;max-height:4.5em;overflow:hidden}
.composer textarea{width:100%;min-height:64px;resize:vertical;background:var(--code);color:var(--fg);border:1px solid var(--border);
  border-radius:4px;padding:5px 7px;font:13px/1.45 var(--ui);outline:none}
.composer textarea:focus{border-color:var(--accent)}
.composer .row{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.composer .row .hint{margin-right:auto;color:var(--muted);font-size:11px;align-self:center}

/* ----- the Oracle ----- */
#oracleBtn.busy{border-color:var(--accent);color:var(--accent);background:var(--hl)}
.crow{color:var(--muted);font-size:11px;margin:-4px 6px 8px}
button.link{border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:inherit}
#reportDlg{background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:8px;max-width:min(760px,90vw);padding:12px}
#reportDlg::backdrop{background:rgba(0,0,0,.5)}
#reportText{white-space:pre-wrap;max-height:60vh;overflow:auto;font:12px/1.45 ui-monospace,Menlo,monospace;margin:0 0 10px}
#reportDlg .acts{display:flex;justify-content:flex-end}

/* ----- toast ----- */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:6px 12px;box-shadow:0 4px 18px rgba(0,0,0,.4);
  display:flex;gap:10px;align-items:center;max-width:min(560px,90vw)}
.toast button{border:0;color:var(--accent);text-decoration:underline;padding:0}

/* ----- chat (bottom right) ----- */
#chat{position:fixed;right:16px;bottom:16px;z-index:40;font-size:12px}
#chatOpen{border:1px solid var(--accent);color:var(--accent);background:var(--bg);border-radius:18px;padding:6px 16px;box-shadow:0 4px 18px #0005}
#chatOpen[hidden],#chatBox[hidden]{display:none}
#chatBox{width:var(--kit-chat-w,min(300px,calc(100vw - 32px)));  /* as wide as the comments column, so it never covers the pages */
  height:var(--kit-chat-h,min(62vh,540px));display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 32px #0007;overflow:hidden}
.chatHead{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);color:var(--muted)}
.chatHead b{color:var(--fg)}
.chatHead .grow{flex:1}
.chatHead button{padding:0 8px}
#chatMsgs{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.cm{max-width:94%;overflow-wrap:anywhere;min-width:0}
.cm.user{align-self:flex-end;background:var(--hl);border-radius:8px 8px 2px 8px;padding:5px 9px;white-space:pre-wrap}
.cm.assistant{align-self:flex-start}
.cm .cq{color:var(--muted);font-style:italic;border-left:2px solid var(--accent);padding-left:6px;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cm .md{font:13px/1.5 var(--ui)}
.cm .md p{margin:.3em 0}
.ctool{color:var(--muted);font-size:11px;padding:1px 0;overflow-wrap:anywhere}
.cerr{color:var(--warn);margin-top:3px}
.cfoot{color:var(--muted);font-size:10px;margin-top:2px}
.cempty{color:var(--muted);padding:12px 4px;line-height:1.5}
.chatCtx{display:flex;gap:6px;align-items:center;padding:3px 10px;min-height:22px;color:var(--muted)}
.chatCtx .grow{flex:1}
.chatCtx label{display:flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
.chatCtx .chip{border:1px solid var(--border);border-radius:10px;padding:0 4px 0 9px;display:inline-flex;gap:4px;align-items:center;
  max-width:170px;min-width:0}
.chatCtx .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatCtx .chip button{border:0;color:var(--muted);padding:0 4px}
#chatCtx{min-width:0;overflow:hidden}
.chatIn{display:flex;gap:6px;padding:6px 10px 10px;border-top:1px solid var(--border)}
.chatIn textarea{flex:1;resize:none;height:54px;background:var(--code);color:var(--fg);border:1px solid var(--border);border-radius:4px;
  padding:5px 8px;font:12px/1.45 var(--ui);outline:none}
.chatIn textarea:focus{border-color:var(--accent)}
.chatIn button{border-color:var(--accent);color:var(--accent);padding:0 12px}
.chatIn button.stop{border-color:var(--warn);color:var(--warn)}
body.chatopen aside{padding-bottom:calc(var(--kit-chat-h,min(62vh,540px)) + 40px)}
@media (max-width:900px){main{grid-template-columns:0 minmax(0,1fr) 0!important}nav,aside{display:none}}
</style>
</head>
<body class="nonav">
<header>
  <a href="/" id="home" title="Files">pdfview</a>
  <a id="dirLink" href="#" title="The folder of this file" hidden>📁</a>
  <span id="name"></span>
  <span class="grow"></span>
  <span class="grp"><button id="navBtn" type="button" title="Contents of the PDF (⌘/Ctrl+B)">☰</button></span>
  <span class="grp"><input id="pageNum" type="text" inputmode="numeric" title="Go to page" value="1"><span id="pageCount">/ –</span></span>
  <span class="grp">
    <button id="zoomOut" type="button" title="Zoom out (-)">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" type="button" title="Zoom in (+)">+</button>
    <button id="zoomFit" type="button" title="Fit the page width (0)">Fit</button>
  </span>
  <button id="darkBtn" type="button" title="Dark pages: text and lines dark, images in their colors (d)">◐ Dark</button>
  <button id="undoBtn" type="button" title="Undo the last change to the comments" disabled>Undo</button>
  <button id="sideBtn" type="button" title="Hide the comments (⌘/Ctrl+\)">Comments</button>
  <span id="live" title="Connected to the server"></span>
</header>
<main>
  <nav id="nav"><h4>Contents</h4><div id="outline"><div class="empty">…</div></div></nav>
  <div id="pages" class="kitPages" tabindex="0"></div>
  <aside id="side">
    <h4><span id="counts">Comments</span></h4>
    <div class="stools">
      <button id="generalBtn" type="button" title="A comment about the whole file">+ Comment</button>
      <button id="oracleBtn" type="button">Oracle</button>
      <span class="grow"></span>
      <button id="resolveAllBtn" type="button" title="Remove every comment (Undo brings them back)" hidden>Resolve all</button>
    </div>
    <div id="oracleRow" class="crow" hidden>Claude remembers earlier rounds on this file. <button id="newSession" type="button" class="link">New session</button></div>
    <div id="threads"></div>
  </aside>
</main>
<div id="selbar"><button id="cbtn" type="button" title="Comment on the selected text (⌘/Ctrl+Shift+M)">💬 Comment</button><button id="hbtn" type="button" title="Highlight the selected text, with no comment (⌘/Ctrl+Shift+H)">🖍 Highlight</button></div>
<div id="hmenu"><button id="hcomment" type="button" title="Make this highlight a comment">💬 Comment</button><button id="hremove" type="button" class="rm" title="Remove this highlight">Remove</button></div>
<div id="chat">
  <button id="chatOpen" type="button" title="Chat with Claude about this PDF (⌘/Ctrl+S)">Chat</button>
  <section id="chatBox" hidden>
    <div class="chatHead"><b>Chat</b><span class="grow"></span>
      <button id="chatNew" type="button" title="Start a new conversation">New</button>
      <button id="chatMin" type="button" title="Hide the chat">–</button></div>
    <div id="chatMsgs"></div>
    <div class="chatCtx"><span id="chatCtx"></span><span class="grow"></span>
      <label title="Claude reads the PDF and answers. It does not add or answer comments."><input type="checkbox" id="chatAsk">Ask only</label></div>
    <div class="chatIn"><textarea id="chatText" placeholder="Ask about this PDF…" title="Enter sends. Shift+Enter makes a new line."></textarea>
      <button id="chatSend" type="button">Send</button></div>
  </section>
</div>
<dialog id="reportDlg">
  <form method="dialog"><pre id="reportText"></pre><div class="acts"><button value="ok">Close</button></div></form>
</dialog>
<div id="toast"></div>
<script src="/kit/kit.js"></script>
<script src="/kit/pdfpages.js"></script>
<script src="/viewer.js"></script>
</body>
</html>
