<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>plateview</title>
<link rel="icon" type="image/png" href="/kit/icons/plate.png">
<link rel="stylesheet" href="/kit/kit.css">
<style>
/* The frame of a plate: a thin bar, the plate in a sandboxed frame, the comments sidebar on the right and the chat at
   the bottom right. At / the list of plates. */
:root{--bg:#f3f5f7;--surface:#ffffff;--sunken:#eceff2;--fg:#17202a;--muted:#5a6774;--line:#d5dce2;--accent:#2357a4;--accent-soft:#e3ebf7;
  --danger:#b3261e;--danger-soft:#fbe9e7;--good:#17845a;--warn:#a85d14;--ui:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;--shadow:0 1px 2px rgba(20,28,38,.06),0 4px 16px rgba(20,28,38,.06);
  --border:var(--line);--panel:var(--surface);--sans:var(--ui);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161b;--surface:#182029;--sunken:#0d1216;--fg:#e5eaef;--muted:#93a0ad;
  --line:#2b3540;--accent:#82aaeb;--accent-soft:#1d2b40;--danger:#ff8f85;--danger-soft:#3a1f1d;--good:#5fd09d;--warn:#e8a264;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161b;--surface:#182029;--sunken:#0d1216;--fg:#e5eaef;--muted:#93a0ad;--line:#2b3540;--accent:#82aaeb;
  --accent-soft:#1d2b40;--danger:#ff8f85;--danger-soft:#3a1f1d;--good:#5fd09d;--warn:#e8a264;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);display:flex;flex-direction:column;overflow:hidden}
button,a.btn{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
button:hover,a.btn:hover{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line);color:var(--fg)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.danger:hover{border-color:var(--danger);color:var(--danger)}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
header{display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface);min-height:40px;white-space:nowrap}
header a.home{color:var(--muted);text-decoration:none;font-weight:600}
header .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
header .grow{flex:1}
#tools{display:flex;gap:5px;align-items:center}
#tools[hidden]{display:none}
.chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--muted)}
.chip.kept{border-color:var(--accent);color:var(--accent)}
#live{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
#live.off{background:var(--danger)}
#err{display:none;background:var(--danger-soft);color:var(--danger);padding:6px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;white-space:pre-wrap}
#err.on{display:block}
#err button{margin-left:10px;font-size:11px;padding:0 8px}

/* ----- layout: the plate, and the comments sidebar ----- */
.shell{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}
body.noside .shell{grid-template-columns:minmax(0,1fr) 0}
body.noside.chatopen .shell{grid-template-columns:minmax(0,1fr) 330px}
body.list .shell{grid-template-columns:minmax(0,1fr) 0}
#stage{grid-column:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#frame{flex:1;border:0;width:100%;background:var(--bg);display:block}
aside{grid-column:2;border-left:1px solid var(--line);overflow:auto;padding:8px 10px 20px;background:var(--surface);min-width:0}
body.noside aside,body.list aside,body.list #chat,body.list #cbtn{display:none!important}
body.chatopen aside{padding-bottom:calc(var(--kit-chat-h,min(62vh,540px)) + 40px)}
@media (max-width:760px){.shell{grid-template-columns:minmax(0,1fr)!important}aside{display:none!important}}
aside h4{margin:4px 6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
aside .empty{color:var(--muted);padding:6px;font-size:13px}
.stools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.stools .grow{flex:1}
.stools button{font-size:12px;padding:2px 9px}
.stools button[hidden]{display:none}
.thread{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:0 0 8px;background:var(--bg);cursor:pointer;font-size:13px}
.thread.active{border-color:var(--accent)}
.thread .top{display:flex;gap:6px;align-items:baseline;margin-bottom:4px}
.thread .where{color:var(--muted);font-size:11px;white-space:nowrap}
.thread q{color:var(--muted);font-style:italic;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thread q::before,.thread q::after{content:none}
.thread .gen{flex:1;color:var(--muted)}
.pill{font-size:10px;border-radius:8px;padding:0 6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.open{border-color:var(--accent);color:var(--accent)}
.pill.answered{border-color:var(--good);color:var(--good)}
.pill.lost{border-color:var(--warn);color:var(--warn)}
.msg{padding:3px 0;border-top:1px dashed var(--line);position:relative}
.msg:first-of-type{border-top:0}
.msg .who{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.msg .who b{color:var(--fg);font-weight:600}
.msg.claude .who b{color:var(--accent)}
.msg .acts{margin-left:auto;display:none;gap:4px}
.msg:hover .acts{display:flex}
.msg .acts button,.thread .tacts button{font-size:11px;padding:0 6px}
.md p{margin:.2em 0}
.md pre{background:var(--sunken);padding:5px 7px;overflow:auto;font-size:12px;margin:.3em 0}
.md code{font:.92em var(--mono)}
.md ul,.md ol{margin:.3em 0;padding-left:1.4em}
.md h4{margin:.5em 0 .2em;font-size:1em}
.thread .tacts{display:flex;gap:4px;margin-top:5px}
.composer{margin:4px 0 8px}
.composer textarea{width:100%;min-height:64px;resize:vertical;background:var(--sunken);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 7px;font:13px/1.45 var(--ui);outline:none}
.composer textarea:focus{border-color:var(--accent)}
.composer .row{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.composer .row .hint{margin-right:auto;color:var(--muted);font-size:11px;align-self:center}
.composer .row button{font-size:12.5px}
/* the comment button and the box of a new comment, above the plate */
#cbtn{position:fixed;z-index:56;display:none;background:var(--surface);border:1px solid var(--accent);color:var(--accent);
  border-radius:14px;padding:3px 10px;box-shadow:0 3px 12px rgba(0,0,0,.25);font-size:13px}
#pop{position:fixed;z-index:57;width:min(340px,calc(100vw - 16px));margin:0;padding:8px;background:var(--surface);
  border:1px solid var(--accent);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#pop .where{color:var(--muted);font-size:11px;margin-bottom:4px}
/* the Oracle */
#oracleBtn.busy{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.crow{color:var(--muted);font-size:11px;margin:-4px 6px 8px}
.crow[hidden]{display:none}
button.link{border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:inherit;background:none}
#reportDlg{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;max-width:min(760px,90vw);padding:12px}
#reportDlg::backdrop{background:rgba(0,0,0,.5)}
#reportText{white-space:pre-wrap;max-height:60vh;overflow:auto;font:12px/1.45 var(--mono);margin:0 0 10px}
#reportDlg .acts{display:flex;justify-content:flex-end}

/* ----- the list of plates ----- */
main.list{flex:1;overflow:auto;padding:28px 16px}
main.list .in{max-width:900px;margin:0 auto;display:grid;gap:14px}
main.list h1{font:600 24px/1.2 var(--ui);margin:0}
main.list p{color:var(--muted);margin:0}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.t a{color:var(--fg);font-weight:600;text-decoration:none}
td.t a:hover{color:var(--accent)}
td .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
td .b{font-size:11px;border-radius:8px;padding:0 6px;border:1px solid var(--accent);color:var(--accent);margin-left:6px}
td.acts{text-align:right;white-space:nowrap}

/* ----- toast ----- */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--fg);color:var(--bg);border-radius:6px;padding:6px 12px;box-shadow:var(--shadow);
  display:flex;gap:10px;align-items:center;max-width:min(560px,90vw)}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;padding:0}

/* ----- chat (bottom right) ----- */
#chat{position:fixed;right:16px;bottom:16px;z-index:40;font-size:12.5px}
#chatOpen{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:18px;padding:6px 16px;box-shadow:var(--shadow)}
#chatOpen[hidden],#chatBox[hidden]{display:none}
#chatBox{width:var(--kit-chat-w,min(310px,calc(100vw - 32px)));height:var(--kit-chat-h,min(62vh,540px));display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.25);overflow:hidden}
.chatHead{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);color:var(--muted)}
.chatHead b{color:var(--fg)}
.chatHead .grow{flex:1}
.chatHead button{padding:0 8px}
#chatMsgs{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.cm{max-width:94%;overflow-wrap:anywhere;min-width:0}
.cm.user{align-self:flex-end;background:var(--accent-soft);border-radius:8px 8px 2px 8px;padding:5px 9px;white-space:pre-wrap}
.cm.assistant{align-self:flex-start}
.cm .cq{color:var(--muted);font-style:italic;border-left:2px solid var(--accent);padding-left:6px;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cm .md{font:13px/1.5 var(--ui)}
.ctool{color:var(--muted);font-size:11px;padding:1px 0;overflow-wrap:anywhere}
.cerr{color:var(--warn);margin-top:3px}
.cfoot{color:var(--muted);font-size:10px;margin-top:2px}
.cempty{color:var(--muted);padding:12px 4px;line-height:1.5}
.chatCtx{display:flex;gap:6px;align-items:center;padding:3px 10px;min-height:22px;color:var(--muted)}
.chatCtx .grow{flex:1}
.chatCtx label{display:flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
.chatCtx .chip{border:1px solid var(--line);border-radius:10px;padding:0 4px 0 9px;display:inline-flex;gap:4px;align-items:center;max-width:180px;min-width:0;font-family:var(--ui)}
.chatCtx .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatCtx .chip button{border:0;color:var(--muted);padding:0 4px;background:none}
#chatCtx{min-width:0;overflow:hidden}
.chatIn{display:flex;gap:6px;padding:6px 10px 10px;border-top:1px solid var(--line)}
.chatIn textarea{flex:1;resize:none;height:54px;background:var(--sunken);color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:5px 8px;font:12.5px/1.45 var(--ui);outline:none}
.chatIn textarea:focus{border-color:var(--accent)}
.chatIn button{border-color:var(--accent);color:var(--accent);padding:0 12px}
.chatIn button.stop{border-color:var(--warn);color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="noside">
<header>
  <a class="home" href="/" title="All plates">plateview</a>
  <span class="title" id="title"></span>
  <span class="chip" id="state" hidden></span>
  <span id="live" title="Connected. The plate updates when its files change."></span>
  <span class="grow"></span>
  <span id="tools" hidden>
    <button id="themeBtn" type="button" title="Light, dark, or as the system">◐ Auto</button>
    <button id="keepBtn" type="button" title="Keep this plate: it is not deleted">Keep</button>
    <button id="exportBtn" type="button" title="Save one HTML file with the data inside. For a PDF, push ⌘/Ctrl+P.">Export</button>
    <button id="deleteBtn" type="button" class="danger" title="Delete this plate now">Delete</button>
    <button id="undoBtn" type="button" title="Undo the last change to the comments" disabled>Undo</button>
    <button id="sideBtn" type="button" title="Show or hide the comments (⌘/Ctrl+\)">Comments</button>
  </span>
</header>
<div id="err"></div>
<div class="shell">
  <div id="stage"></div>
  <aside id="side">
    <h4 id="counts">Comments</h4>
    <div class="stools">
      <button id="generalBtn" type="button" title="A comment about the whole plate">+ Comment</button>
      <button id="oracleBtn" type="button">Oracle</button>
      <span class="grow"></span>
      <button id="resolveAllBtn" type="button" title="Remove every comment (Undo brings them back)" hidden>Resolve all</button>
    </div>
    <div id="oracleRow" class="crow" hidden>Claude remembers earlier rounds on this plate. <button id="newSession" type="button" class="link">New session</button></div>
    <div id="threads"></div>
  </aside>
</div>
<button id="cbtn" type="button" title="Comment on the selection (⌘/Ctrl+Shift+M)">💬 Comment</button>
<div id="chat">
  <button id="chatOpen" type="button" title="Chat with Claude about this plate (⌘/Ctrl+S)">Chat</button>
  <section id="chatBox" hidden>
    <div class="chatHead"><b>Chat</b><span class="grow"></span>
      <button id="chatNew" type="button" title="Start a new conversation">New</button>
      <button id="chatMin" type="button" title="Hide the chat">–</button></div>
    <div id="chatMsgs"></div>
    <div class="chatCtx"><span id="chatCtx"></span><span class="grow"></span>
      <label title="Claude reads the plate and its data, and answers. It changes nothing."><input type="checkbox" id="chatAsk">Ask only</label></div>
    <div class="chatIn"><textarea id="chatText" placeholder="Ask about this plate…" title="Enter sends. Shift+Enter makes a new line."></textarea>
      <button id="chatSend" type="button">Send</button></div>
  </section>
</div>
<dialog id="reportDlg">
  <form method="dialog"><pre id="reportText"></pre><div class="acts"><button value="ok">Close</button></div></form>
</dialog>
<div id="toast"></div>
<script src="/kit/kit.js"></script>
<script src="/shell.js"></script>
</body>
</html>
